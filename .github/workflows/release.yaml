name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    if: |
      !contains(github.event.head_commit.message, '[ciskip]')
    uses: ./.github/workflows/base.yaml
    with:
      gradle-tasks: 'build publishMods'
    secrets:
      curse-token: ${{ secrets.CURSE_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
